version: '3.8'
services:
  pastebin:
    build: .
    container_name: pastebin_backend
    restart: unless-stopped
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - pastebin_net
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DBNAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - pastebin_net

  migrate:
    image: migrate/migrate
    container_name: pastebin_migrate
    restart: "no"
    command: ["-path", "/migrations", "-database", "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_DBNAME}?sslmode=${DB_SSLMODE}", "up"] 
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    networks:
      - pastebin_net

networks:
  pastebin_net:
    driver: bridge

volumes:
  db_data:
